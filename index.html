<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>작업-모듈 배치 시뮬레이터</title>
    <style>
      /* 색·크기 상수 (캔버스 색은 src/render/theme.ts) */
      :root {
        --bg: #111116;
        --panel-bg: #1a1a20;
        --panel-border: #2e2e38;
        --text: #e8e8ee;
        --text-dim: #9a9aa8;
        --btn-bg: #2a2a33;
        --btn-bg-hover: #36363f;
        --btn-border: #44444f;
        --btn-primary: #06d6a0;
        --btn-primary-text: #0b0b10;
        --ended: #ff6b6b;
        --sidebar-width: 300px;
        --gap: 12px;
        --radius: 6px;
        --font-size: 14px;
        --font-size-small: 12px;
        --narrow-stage-height: 60vh;
        --stage-min-height: 320px;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text); }
      body {
        font: var(--font-size) / 1.4 system-ui, -apple-system, "Segoe UI", "Noto Sans KR", sans-serif;
        display: grid;
        grid-template-columns: minmax(0, 1fr) var(--sidebar-width);
        grid-template-rows: minmax(0, 1fr);
        height: 100vh;
        overflow: hidden;
      }
      #stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
      /* 터치 드래그가 스크롤·확대로 가로채이지 않게 한다 */
      /* 캔버스는 무대 크기를 바꾸지 않도록 띄워 둔다 (크기는 main.ts가 무대에 맞춘다) */
      canvas { position: absolute; inset: 0 auto auto 0; display: block; touch-action: none; }
      #sidebar {
        display: flex; flex-direction: column; gap: var(--gap);
        padding: var(--gap); background: var(--panel-bg);
        border-left: 1px solid var(--panel-border); overflow-y: auto; min-width: 0;
      }
      #controls, #session-controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
      .ctrl-btn {
        font: inherit; color: var(--text); background: var(--btn-bg);
        border: 1px solid var(--btn-border); border-radius: var(--radius);
        padding: 6px 10px; cursor: pointer;
      }
      .ctrl-btn:hover:not(:disabled) { background: var(--btn-bg-hover); }
      .ctrl-btn:disabled { opacity: 0.4; cursor: not-allowed; }
      .ctrl-primary { background: var(--btn-primary); color: var(--btn-primary-text); border-color: var(--btn-primary); min-width: 7.5em; }
      .ctrl-primary:hover:not(:disabled) { background: var(--btn-primary); filter: brightness(1.1); }
      .ctrl-speed, .ctrl-select { display: inline-flex; gap: 6px; align-items: center; color: var(--text-dim); }
      .ctrl-select { min-width: 0; }
      .ctrl-select select { max-width: 100%; min-width: 0; }
      .ctrl-export { flex-basis: 100%; }
      .ctrl-speed select, .ctrl-select select {
        font: inherit; color: var(--text); background: var(--btn-bg);
        border: 1px solid var(--btn-border); border-radius: var(--radius); padding: 4px 6px;
      }
      .ctrl-status { flex-basis: 100%; color: var(--text-dim); font-size: var(--font-size-small); }
      .ctrl-status-ended { color: var(--ended); }
      .ctrl-status-ok { color: var(--btn-primary); }
      .ctrl-status-error { color: var(--ended); }
      .ctrl-status:empty { display: none; }
      .ctrl-replay-load { flex-basis: 100%; text-align: center; }
      .ctrl-replay-load:focus-visible { outline: 2px solid var(--btn-primary); }
      .shortcuts { color: var(--text-dim); font-size: var(--font-size-small); margin: 0; }
      kbd {
        font: inherit; border: 1px solid var(--btn-border); border-radius: 3px;
        padding: 0 4px; background: var(--btn-bg);
      }
      .panel-title { font-size: var(--font-size); margin: 0 0 6px; }
      .panel-subtitle { font-size: var(--font-size-small); color: var(--text-dim); margin: var(--gap) 0 4px; font-weight: normal; }
      .metrics-summary { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; }
      .metrics-summary dt { color: var(--text-dim); cursor: help; }
      .metrics-summary dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
      .metrics-modules { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
      .metrics-modules th, .metrics-modules td { padding: 3px 4px; text-align: right; border-bottom: 1px solid var(--panel-border); }
      .metrics-modules th:first-child { text-align: left; }
      .metrics-modules thead th { color: var(--text-dim); font-weight: normal; font-size: var(--font-size-small); cursor: help; }
      /* 모듈 편집(시나리오 편집) 패널 */
      .editor { border-top: 1px solid var(--panel-border); padding-top: var(--gap); }
      .editor-summary { cursor: pointer; margin: 0; }
      .editor-form { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
      .editor-section { border: 1px solid var(--panel-border); border-radius: var(--radius); padding: 6px 8px 8px; margin: 0; min-width: 0; }
      .editor-section > .panel-subtitle { margin: 0; padding: 0 4px; }
      .editor-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 6px; }
      .editor-field { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
      .editor-label { color: var(--text-dim); font-size: var(--font-size-small); }
      .editor-check { display: flex; gap: 6px; align-items: center; color: var(--text-dim); font-size: var(--font-size-small); margin: 4px 0; }
      .editor-input {
        font: inherit; font-size: var(--font-size-small); color: var(--text); background: var(--btn-bg);
        border: 1px solid var(--btn-border); border-radius: var(--radius); padding: 3px 5px; width: 100%; min-width: 0;
      }
      .editor-input:disabled { opacity: 0.4; }
      .editor-textarea { resize: vertical; font-family: ui-monospace, monospace; }
      .editor-invalid { border-color: var(--ended); }
      .editor-field-error { color: var(--ended); font-size: var(--font-size-small); }
      .editor-field-error:empty { display: none; }
      .editor-modules { width: 100%; border-collapse: collapse; table-layout: fixed; margin-bottom: 6px; }
      .editor-modules th { color: var(--text-dim); font-weight: normal; font-size: var(--font-size-small); text-align: left; padding: 2px; }
      .editor-modules td { padding: 2px; vertical-align: top; }
      .editor-modules th:last-child, .editor-modules td:last-child { width: 2.2em; }
      .editor-remove { padding: 2px 6px; }
      .editor-errors { color: var(--ended); font-size: var(--font-size-small); margin: 8px 0 0; padding-left: 1.2em; }
      .editor-errors:empty { display: none; }
      .editor-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
      .editor-load { text-align: center; }
      .editor-load:focus-visible { outline: 2px solid var(--btn-primary); }
      /* 좁은 화면: 캔버스 위, 패널 아래로 쌓는다 */
      @media (max-width: 760px) {
        body {
          grid-template-columns: minmax(0, 1fr);
          grid-template-rows: var(--narrow-stage-height) auto;
          height: auto; min-height: 100vh; overflow: auto;
        }
        #stage { min-height: var(--stage-min-height); }
        #sidebar { border-left: none; border-top: 1px solid var(--panel-border); overflow: visible; }
      }
    </style>
  </head>
  <body>
    <main id="stage">
      <canvas id="sim-canvas"></canvas>
    </main>
    <aside id="sidebar">
      <section id="controls" aria-label="실행 컨트롤"></section>
      <section id="session-controls" aria-label="감독관·시나리오 선택, 결과 내보내기와 리플레이"></section>
      <p class="shortcuts"><kbd>Space</kbd> 재생/정지 · <kbd>→</kbd> 한 단계 · <kbd>R</kbd> 리셋</p>
      <section id="metrics" aria-label="지표"></section>
      <section id="scenario-editor" aria-label="모듈 편집(시나리오 편집)"></section>
    </aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
